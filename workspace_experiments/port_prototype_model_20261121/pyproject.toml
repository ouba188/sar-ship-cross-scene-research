[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-port-prototypes"
version = "0.1.0"
description = "Composable dual-polarization SAR source-port prototype research model"
requires-python = ">=3.10"
dependencies = ["numpy", "torch>=2.1", "torchvision>=0.16", "Pillow", "scipy"]

[project.scripts]
sar-port = "sar_port.cli:main"

[tool.setuptools.packages.find]
include = ["sar_port*"]
