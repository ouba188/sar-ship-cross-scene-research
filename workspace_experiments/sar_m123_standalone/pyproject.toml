[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-m123"
version = "0.2.0"
description = "Native-chip SAR ship classification with formal and aligned models"
requires-python = ">=3.10"
dependencies = ["torch>=2.7,<2.8", "torchvision>=0.22,<0.23", "numpy>=2.0,<3", "scipy>=1.14,<2", "Pillow>=11,<12"]

[project.optional-dependencies]
migration = ["pandas>=2,<3"]
visualization = ["matplotlib>=3.8,<4", "pandas>=2,<3"]
training = ["pandas>=2,<3"]

[project.scripts]
sar-m123 = "sar_m123.cli:main"
sar-m123-train = "sar_m123.train_aligned:main"

[tool.setuptools.packages.find]
include = ["sar_m123*"]
