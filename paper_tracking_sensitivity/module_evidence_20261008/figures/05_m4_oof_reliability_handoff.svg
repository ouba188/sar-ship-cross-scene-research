   <g id="text_1">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #222222" x="17.007874" y="26.107483" transform="rotate(-0 17.007874 26.107483)">5  M4 | Source-learned reliability and budgeted handoff</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.4px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #565656" x="17.007874" y="48.532248" transform="rotate(-0 17.007874 48.532248)">The inherited LR parameters read the actual receiving expert's adapted scores.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #2166ac" x="17.007874" y="88.902037" transform="rotate(-0 17.007874 88.902037)">A  Offline source OOF learning</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #2166ac" x="25.511811" y="122.772191" transform="rotate(-0 25.511811 122.772191)">Out-of-port source base/expert scores + source truth</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #222222" x="25.511811" y="142.037461" transform="rotate(-0 25.511811 142.037461)">Held port and shared identities excluded from head fitting; OOF is conditional on the encoder.</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #2166ac" x="25.511811" y="219.150144" transform="rotate(-0 25.511811 219.150144)">4-D confidence + weighted scaling</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(25.511811 238.167195)">x = [expert margin, base margin,</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(25.511811 247.409595)">       expert entropy, base entropy]</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(25.511811 256.651995)">Equal mass per port, then per present class</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(25.511811 265.929345)">Source counts and scaling before filtering</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #762a83" x="283.464567" y="219.150144" transform="rotate(-0 283.464567 219.150144)">Logistic regression | C = 1</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(283.464567 238.190945)">delta = 1[expert correct] - 1[base correct]</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(283.464567 247.468295)">Recovery (+1) vs harm (-1) on disagreements</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(283.464567 256.710695)">Discard zero-utility rows; use source weights</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(283.464567 266.081795)">Freeze center, scale, coefficients, intercept</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #565656" x="17.007874" y="328.973356" transform="rotate(-0 17.007874 328.973356)">Margin = top1 - top2 score; entropy = H(softmax(scores)), using all 8 class scores.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #762a83" x="17.007874" y="358.193375" transform="rotate(-0 17.007874 358.193375)">B  Target query selection: fixed gate, adapted score inputs</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #1b7837" x="25.511811" y="394.898175" transform="rotate(-0 25.511811 394.898175)">Compute both adapted score matrices</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(25.511811 414.082726)">Base64 + actual joint expert64 scores</text>
    <text style="font-size: 8.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(25.511811 423.688104)">Same 64 support labels; form 4-D x</text>
    <text style="font-size: 8.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(25.511811 433.197388)">All expert features already computed</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #762a83" x="283.464567" y="394.788488" transform="rotate(-0 283.464567 394.788488)">Fixed receiving-expert gate</text>
   </g>
   <g id="text_15">
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(283.464567 414.012726)">g = ((x - center) / scale) dot beta + b</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(283.464567 423.255126)">Parameters inherited from source OOF</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(283.464567 432.532476)">No target gate refit or threshold tuning</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #762a83" x="25.511811" y="508.174315" transform="rotate(-0 25.511811 508.174315)">Eligible query rows only</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(25.511811 527.468553)">Exclude all 64 supports; require base prediction != expert prediction and g &gt; 0.</text>
    <text style="font-size: 8.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(25.511811 536.974147)">The expert-predicted class must appear among the 64 support labels.</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #762a83" x="25.511811" y="613.165892" transform="rotate(-0 25.511811 613.165892)">Stable batch ranking</text>
   </g>
   <g id="text_19">
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(25.511811 632.182943)">Descending g; ties by ascending row ID</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(25.511811 641.554043)">Select at most floor(0.05 N_query) eligible</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #762a83" x="283.464567" y="613.056204" transform="rotate(-0 283.464567 613.056204)">Final prediction</text>
   </g>
   <g id="text_21">
    <text style="font-size: 8.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(283.464567 632.426037)">Selected -&gt; expert argmax</text>
    <text style="font-size: 8.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(283.464567 642.038179)">Otherwise -&gt; base argmax</text>
   </g>
   <g id="text_22">
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #565656" x="17.007874" y="680.371919" transform="rotate(-0 17.007874 680.371919)">N_query excludes support rows. The cap counts changed decisions, not compute savings.</text>
   </g>
  </g>
 </g>
