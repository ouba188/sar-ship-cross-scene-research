    <text style="font-size: 8.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(144.566929 403.921178)">w_i = 64 / (C_S n_{y_i}); W = diag(w_i)</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #1b7837" x="25.511811" y="479.937546" transform="rotate(-0 25.511811 479.937546)">Base correction | Delta_b</text>
   </g>
   <g id="text_12">
