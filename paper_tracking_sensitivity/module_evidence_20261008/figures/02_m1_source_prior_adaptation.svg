   </g>
   <g id="text_2">
    <text style="font-size: 8.4px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #565656" x="17.007874" y="48.557185" transform="rotate(-0 17.007874 48.557185)">The same 64 target labels update the base and the M2-enabled expert.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #2166ac" x="25.511811" y="105.764317" transform="rotate(-0 25.511811 105.764317)">Source-only fitting cohort</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(25.511811 125.029587)">Purge overlapping source identities; exclude the held source port for episode / OOF fits.</text>
    <text style="font-size: 8.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(25.511811 134.634964)">Fit PCA, standardization and class-balanced source RidgeClassifier heads (alpha = 1).</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #2166ac" x="25.511811" y="221.98479" transform="rotate(-0 25.511811 221.98479)">Base branch | R50</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(25.511811 241.001841)">2048-D features -&gt; PCA128 -&gt; source z-score</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(25.511811 250.150491)">Fixed source head gives prior P_b</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(25.511811 259.521591)">Residual map: [standardized128 / sqrt(128), 1]</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(25.511811 268.763991)">129 coordinates; source-fitted statistics</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #2166ac" x="283.464567" y="221.98479" transform="rotate(-0 283.464567 221.98479)">Expert branch | R50 + R18</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(283.464567 241.001841)">PCA128 + PCA64 -&gt; standardized192</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(283.464567 250.181841)">Fixed ridge-1 head gives prior P_e</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(283.464567 259.455591)">M2 adds source-normalized complement</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(283.464567 268.635591)">Residual map phi_e: 2753 coordinates</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #1b7837" x="144.566929" y="375.055656" transform="rotate(-0 144.566929 375.055656)">One shared support set S | n = 64</text>
   </g>
   <g id="text_10">
