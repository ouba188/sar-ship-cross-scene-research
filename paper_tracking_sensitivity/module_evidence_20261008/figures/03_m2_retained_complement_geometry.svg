   <g id="text_1">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #222222" x="17.007874" y="26.107483" transform="rotate(-0 17.007874 26.107483)">3  M2 | Retained and orthogonal-complement geometry</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.4px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #565656" x="17.007874" y="48.634623" transform="rotate(-0 17.007874 48.634623)">Source-fitted projections and normalization; fixed half-kernel mixing.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #2166ac" x="25.511811" y="108.598963" transform="rotate(-0 25.511811 108.598963)">R50 feature f_50 | 2048-D</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #222222" x="25.511811" y="127.859108" transform="rotate(-0 25.511811 127.859108)">Paired VV/VH; frozen pooled representation</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #2166ac" x="283.464567" y="108.598963" transform="rotate(-0 283.464567 108.598963)">SimCLR-pretrained R18 | 512-D</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #222222" x="283.464567" y="127.783514" transform="rotate(-0 283.464567 127.783514)">VH grayscale; trunk only; M3 updates layer4</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #2166ac" x="25.511811" y="213.480853" transform="rotate(-0 25.511811 213.480853)">Center separately in each encoder's source coordinates</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.1px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(25.511811 232.6682)">c_j = f_j - mu_j; PCA rows U_j are source-fitted orthonormal directions.</text>
    <text style="font-size: 8.1px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(25.511811 242.156439)">z_j = c_j U_j^T; d_j = c_j - (c_j U_j^T) U_j, for j in {50, 18}.</text>
    <text style="font-size: 8.1px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(25.511811 251.546111)">Retain 128 R50 directions and 64 R18 directions; keep residuals in ambient coordinates.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #2166ac" x="25.511811" y="332.535971" transform="rotate(-0 25.511811 332.535971)">Retained branch | 192-D</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(25.511811 351.696178)">R50 PCA128 source-standardized first</text>
    <text style="font-size: 8.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(25.511811 361.073544)">Concatenate with R18 PCA64</text>
    <text style="font-size: 8.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(25.511811 370.45091)">Source-standardize all 192 coordinates</text>
    <text style="font-size: 8.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(25.511811 379.960194)">p = standardized192 / sqrt(192)</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #1b7837" x="283.464567" y="332.535971" transform="rotate(-0 283.464567 332.535971)">Complement branch | 2560-D</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(283.464567 351.796115)">Concatenate [d_50, d_18]: 2048 + 512</text>
    <text style="font-size: 8.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(283.464567 361.305399)">Subtract source complement mean</text>
    <text style="font-size: 8.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(283.464567 370.682765)">Divide by source complement scale</text>
    <text style="font-size: 8.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(283.464567 380.288143)">d = normalized2560 / sqrt(2560)</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #2166ac" x="25.511811" y="482.772191" transform="rotate(-0 25.511811 482.772191)">Fixed branch weight sqrt(0.5)</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #222222" x="25.511811" y="502.032336" transform="rotate(-0 25.511811 502.032336)">Retained coordinates also feed the prior</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #1b7837" x="283.464567" y="482.772191" transform="rotate(-0 283.464567 482.772191)">Fixed branch weight sqrt(0.5)</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #222222" x="283.464567" y="501.932398" transform="rotate(-0 283.464567 501.932398)">Explicit projection; no learned attention</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #1b7837" x="25.511811" y="584.819435" transform="rotate(-0 25.511811 584.819435)">Joint map | 192 + 2560 + 1 = 2753 coordinates</text>
   </g>
   <g id="text_18">
    <text style="font-size: 8.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', sans-serif; text-anchor: start; fill: #222222" x="25.511811" y="604.07958" transform="rotate(-0 25.511811 604.07958)">phi = [sqrt(0.5) p, sqrt(0.5) d, 1]     -&gt;     M1 residual adaptation / M3 ridge solve</text>
   </g>
